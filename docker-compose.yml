services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"          
    environment:
      MONGO_INITDB_DATABASE: myapp
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro

  auth_api:
    build: .
    command: python -m api.auth_api
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      - mongo
    restart: on-failure

  image_api:
    build: .
    command: python -m api.image_api
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb://mongo:27017/
    depends_on:
      - mongo
    restart: on-failure
    volumes:
      - ./images:/app/images
      - ./downloads:/app/downloads

volumes:
  mongo_data:
